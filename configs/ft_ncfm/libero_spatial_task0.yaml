experiment:
  name: libero_spatial_task0_single_seed_gate
  output_dir: artifacts/libero_spatial_task0
  seeds: [42]

runtime:
  deterministic: true
  deterministic_warn_only: false

data:
  dataset: libero
  suite: libero_spatial
  task_name: pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate
  instruction: pick up the black bowl between the plate and the ramekin and place it on the plate
  path: data_cache/libero/libero_spatial/pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate_demo.hdf5
  url: https://huggingface.co/datasets/yifengzhu-hf/LIBERO-datasets/resolve/main/libero_spatial/pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate_demo.hdf5
  bytes: 508779600
  sha256: ff6f26121653c77280eb40a38773a74141c11a8509f3466058cb56dd2cc60ead
  libero_sha: 8f1084e3132a39270c3a13ebe37270a43ece2a01
  image_size: 128
  instruction_length: 80
  transition_stride: 1
  demo_split:
    train: 35
    influence_reference: 5
    selection_validation: 5
    final_test: 5

guide:
  representation_dim: 128
  visual_dim: 96
  language_dim: 32
  proprio_dim: 32
  steps: 750
  batch_size: 64
  encode_batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001

influence:
  # Replaced with the selection-validation winner from the factorial proxy gate.
  selection_source: minivla_factorial_ablation
  selection_seed: 42
  selected_condition: sign=paper__rank=smallest__norm=positive_shift
  sign: paper
  ranking: smallest
  normalization: positive_shift
  elite_ratio: 0.05
  reference_batch_size: 32
  hessian_batch_size: 16
  lissa_depth: 30
  lissa_damping: 0.01
  lissa_scale: 10.0
  lissa_repeats: 1
  beta: 1.0
  epsilon: 1.0e-8

distillation:
  coreset_ratio: 0.05
  num_frequencies: 128
  hidden_dim: 64
  steps: 300
  discriminator_steps: 1
  generator_lr: 0.02
  discriminator_lr: 0.001
  convergence_window_ratio: 0.10

downstream:
  hidden_dim: 128
  steps: 1000
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001

rollout:
  enabled: true
  libero_root: /content/LIBERO
  episodes: 5
  max_steps: 600
