experiment:
  name: mnist_minivla_factorial_ablation
  output_dir: artifacts/minivla_factorial_ablation
  seeds: [42, 123, 1024]

runtime:
  deterministic: true
  deterministic_warn_only: false

data:
  dataset: mnist
  cache_dir: data_cache
  train_ratio: 0.05
  reference_size: 512
  selection_size: 1024
  test_size: 2048
  stratified: true

guide:
  hidden_dim: 32
  full_steps: 200
  duration_ratio: 0.15
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.01

influence:
  elite_ratio: 0.05
  reference_batch_size: 64
  lissa_depth: 50
  lissa_damping: 0.01
  lissa_scale: 10.0
  lissa_repeats: 1
  hessian_batch_size: 32
  beta: 1.0
  epsilon: 1.0e-8

ablation:
  signs: [paper, gradient_alignment]
  rankings: [largest, smallest]
  normalizations: [positive_shift, clamp, softmax]

distillation:
  coreset_ratio: 0.05
  batch_size: 64
  num_frequencies: 64
  hidden_dim: 32
  steps: 100
  discriminator_steps: 1
  generator_lr: 0.03
  discriminator_lr: 0.001
  convergence_window_ratio: 0.10

downstream:
  hidden_dim: 64
  steps: 200
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
