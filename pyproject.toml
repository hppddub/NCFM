[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ft-ncfm-replication"
version = "0.1.0"
description = "An auditable reproduction scaffold for FT-NCFM built on the official NCFM implementation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.1.3",
  "PyYAML==6.0.2",
  "torch==2.5.0",
  "torchvision==0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
plots = ["matplotlib==3.8.4"]
libero = ["h5py>=3.11,<4"]

[project.scripts]
ft-ncfm-poc = "ft_ncfm.experiment:main"
ft-ncfm-ablation = "ft_ncfm.ablation:main"
ft-ncfm-libero = "ft_ncfm.libero_experiment:main"

[tool.setuptools.packages.find]
include = ["ft_ncfm*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
